<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Problema 2 - Grilla Responsiva Bootstrap 3</title>
  <!-- Bootstrap 3 CSS CDN -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
</head>
<body>

  <div class="container">
    <header class="page-header">
      <h1>Panel Responsivo - Evaluación Semana 1</h1>
    </header>

    <div class="row">
      <!-- Tarjeta Principal: 4 columnas en desktop (4/12 = 33.33% de 1440px) -->
      <main class="col-xs-12 col-sm-6 col-md-4">
        <div class="panel panel-primary">
          <div class="panel-heading">
            <h3 class="panel-title">Tarjeta Principal (4 Columnas)</h3>
          </div>
          <div class="panel-body">
            Este bloque equivale a 480px dentro de un contenedor de 1440px (33.33% del ancho útil).
          </div>
        </div>
      </main>

      <!-- Contenido Secundario: 8 columnas restantes -->
      <aside class="col-xs-12 col-sm-6 col-md-8">
        <div class="panel panel-default">
          <div class="panel-heading">
            <h3 class="panel-title">Contenido Secundario (8 Columnas)</h3>
          </div>
          <div class="panel-body">
            Este bloque ocupa las 8 columnas restantes para completar la grilla de 12 partes.
          </div>
        </div>
      </aside>
    </div>
  </div>

</body>
</html>
