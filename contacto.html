<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto - Mahvel Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .marvel-red { background-color: #e23636 !important; color: white; }
        .marvel-red-text { color: #e23636 !important; }
        .bg-dark-custom { background-color: #202020 !important; }
    </style>
</head>
<body class="bg-dark-custom text-light d-flex flex-column min-vh-100">

    <!-- Navbar (Mantenemos la misma estructura de navegación) -->
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark border-bottom border-danger border-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-uppercase" href="index.html">
                <span class="marvel-red px-2 py-1">Mahvel</span> Hub
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button> 
            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="comics.html">Cómics</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="personajes.html">Personajes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="contacto.html">Contacto</a>
                    </li>                           
                </ul>
            </div>  
        </div>
    </nav>

    <div class="container mt-5 mb-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card bg-dark text-white border-danger shadow">
                    <div class="card-header border-bottom border-danger">
                        <h3 class="mb-0 text-center">Transmisión Cifrada</h3>
                    </div>
                    <div class="card-body p-4">
                        <form action="index.html">
                            <div class="mb-3">
                                <label for="nombre" class="form-label text-secondary">Alias / Nombre:</label>
                                <input type="text" class="form-control bg-dark-custom text-white border-secondary" id="nombre" placeholder="Ej. Peter Parker" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label text-secondary">Correo de contacto:</label>
                                <input type="email" class="form-control bg-dark-custom text-white border-secondary" id="email" placeholder="correo@ejemplo.com" name="email" required>
                            </div>                
                            
                            <div class="mb-4">
                                <label for="comment" class="form-label text-secondary">Mensaje / Reporte:</label>
                                <textarea class="form-control bg-dark-custom text-white border-secondary" rows="5" id="comment" name="text" placeholder="Escribe tu mensaje aquí..." required></textarea>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-danger">Enviar Mensaje</button>
                                <a href="index.html" class="btn btn-outline-secondary">Cancelar y Volver</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="container-fluid bg-black text-center py-4 border-top border-danger border-3 mt-auto">
        <div class="row">
            <div class="col-12">
                <p class="text-white-50 mb-0">&copy; 2026 Mahvel Hub</p>
            </div>
        </div>
    </footer>

</body>
</html>
